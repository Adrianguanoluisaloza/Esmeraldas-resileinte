openapi: 3.0.3
info:
  title: Esmeraldas Resiliente API
  version: 1.0.0
  description: >-
    API oficial y única fuente de verdad para la plataforma de reporte y gestión
    de emergencias por el fenómeno de El Niño en Esmeraldas (Ecuador).
    Diseñada con arquitectura offline-first para sincronización resiliente.

    Errores: todas las respuestas de error usan el esquema Error con un `codigo` estable
    (VALIDACION, NO_AUTENTICADO, SIN_PERMISO, NO_ENCONTRADO, CONFLICTO, TRANSICION_INVALIDA,
    NO_IMPLEMENTADO, ERROR_INTERNO). La web y la app eligen el texto a mostrar según el código.

    Tiempo real: `GET /ws?token=JWT` abre un WebSocket. Mensajes JSON
    `{ "tipo": "reporte.creado" | "reporte.estado" | "punto.ocupacion" | "alerta.emitida", "datos": {...} }`.
    El COE recibe todo; un ciudadano solo recibe alertas, cupos y los cambios de sus propios reportes.

    Origen del dato (exigido por el reto): `ciudadano` (reporte de la comunidad), `simulado`
    (escenario Jueves 06:00) y `oficial` (INAMHI / SNGR). Debe diferenciarse en la interfaz.

servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo local
  - url: https://api.esmeraldas-resiliente.org
    description: Servidor de producción / Cloudflare

paths:
  /auth/registro:
    post:
      summary: Registro de nuevo ciudadano u operador
      tags: [Autenticación]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, correo, password]
              properties:
                nombre:
                  type: string
                  example: Juan Pérez
                correo:
                  type: string
                  format: email
                  example: juan.perez@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '409':
          description: Correo ya registrado

  /auth/recuperar:
    post:
      summary: Pedir un enlace para restablecer la contraseña
      description: Responde 202 exista o no el correo, para no revelar qué correos están registrados.
      tags: [Autenticación]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo]
              properties:
                correo:
                  type: string
                  format: email
      responses:
        '202':
          description: Solicitud recibida

  /auth/restablecer:
    post:
      summary: Crear una contraseña nueva con el token del enlace
      tags: [Autenticación]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '204':
          description: Contraseña actualizada
        '400':
          description: Enlace inválido, vencido o ya usado

  /auth/firebase:
    post:
      summary: Cambiar un idToken de Firebase (ingreso con Google) por un token JWT propio
      tags: [Autenticación]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Token de Firebase inválido o vencido

  /auth/login:
    post:
      summary: Iniciar sesión y obtener token JWT
      tags: [Autenticación]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, password]
              properties:
                correo:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciales inválidas

  /salud:
    get:
      summary: Endpoint liviano de verificación de conectividad
      description: Usado por la app móvil antes de sincronizar la cola offline.
      tags: [Utilidades]
      responses:
        '200':
          description: Servicio disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /reportes:
    post:
      summary: 'Crear reporte ciudadano (Paso 1 offline: datos livianos)'
      description: >-
        Idempotente mediante UUID v4 generado en el celular. Si el reporte ya fue
        recibido, retorna 200/201 sin duplicar registros. Sin cabecera Authorization se
        guarda como reporte de emergencia sin cuenta (usuario_id null). Con un token
        inválido o vencido responde 401.
      tags: [Reportes]
      security:
        - {}
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReporteCrearInput'
      responses:
        '201':
          description: Reporte creado o recibido previamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reporte'
        '400':
          $ref: '#/components/responses/ErrorValidacion'

    get:
      summary: Listar reportes con filtros
      tags: [Reportes]
      security:
        - BearerAuth: []
      parameters:
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoReporte'
        - name: tipo
          in: query
          schema:
            $ref: '#/components/schemas/TipoIncidente'
        - name: gravedad
          in: query
          schema:
            $ref: '#/components/schemas/Gravedad'
        - name: verificado
          in: query
          schema:
            type: boolean
        - name: limite
          in: query
          schema:
            type: integer
            default: 50
        - name: pagina
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Lista paginada de reportes
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  pagina:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reporte'

  /reportes/{id}:
    get:
      summary: Obtener detalle de un reporte por ID
      tags: [Reportes]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle del reporte con historial de estados y fotos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteDetalle'
        '404':
          description: Reporte no encontrado

  /reportes/{id}/estado:
    patch:
      summary: Actualizar estado de atención de un reporte (Solo Operador 911 / Admin)
      tags: [Reportes]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  $ref: '#/components/schemas/EstadoReporte'
                nota:
                  type: string
                  example: Unidad de bomberos despachada al sector.
                verificado:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reporte'
        '403':
          description: No autorizado (requiere rol operador_911 o admin)

  /reportes/{id}/foto:
    post:
      summary: Subir foto comprimida asociada al reporte (Paso 2 offline)
      description: >-
        Sube el archivo JPEG/PNG (máx 2MB, recomendado 150-400 KB).
        El servidor genera automáticamente una miniatura (20-40 KB).
        Reporte con cuenta: solo su dueño. Reporte sin cuenta: sin token, una sola vez y
        dentro de 2 horas desde que se recibió.
      tags: [Fotos]
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [foto]
              properties:
                foto:
                  type: string
                  format: binary
                  description: Archivo de foto comprimida
      responses:
        '201':
          description: Foto recibida y procesada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Foto'
        '400':
          description: Archivo no válido o tamaño excedido
        '404':
          description: Reporte no encontrado

  /reportes/{id}/clasificar:
    post:
      summary: Sugerencia de tipo y gravedad con IA (Asistente no oficial)
      description: >-
        Analiza la foto del reporte y devuelve sugerencia de tipo, gravedad,
        confianza y explicación en palabras. Marcada como sugerencia no vinculante.
      tags: [IA]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Clasificación sugerida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SugerenciaIA'

  /vias:
    get:
      summary: Red vial con estado (habilitada, parcial, bloqueada)
      tags: [Zonas de Riesgo]
      responses:
        '200':
          description: Vías en formato GeoJSON FeatureCollection (LineString)

  /usuarios:
    get:
      summary: Listar usuarios (solo administrador)
      tags: [Administración]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Usuarios registrados, máximo 200
        '403':
          description: Requiere rol admin

  /usuarios/{id}/rol:
    patch:
      summary: Cambiar el rol de otro usuario (solo administrador)
      tags: [Administración]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rol]
              properties:
                rol:
                  type: string
                  enum: [ciudadano, operador_911, bomberos, policia, admin]
      responses:
        '200':
          description: Usuario actualizado
        '403':
          description: Requiere rol admin
        '409':
          description: No se puede cambiar el rol propio

  /fotos/{nombre}:
    get:
      summary: Foto o miniatura de un reporte
      tags: [Reportes]
      parameters:
        - name: nombre
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Imagen JPEG o PNG
        '404':
          description: No existe

  /puntos-servicio/cercanos:
    get:
      summary: Albergues o centros de salud con cupo, ordenados por distancia real (PostGIS)
      tags: [Puntos de Servicio]
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/TipoPuntoServicio' } }
        - name: personas
          in: query
          description: Cupos libres mínimos (tamaño de la familia)
          schema: { type: integer, default: 1 }
        - { name: limite, in: query, schema: { type: integer, default: 3, maximum: 20 } }
      responses:
        '200':
          description: Puntos con cupo más cercanos
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/PuntoServicio'
                    - type: object
                      properties:
                        distancia_m: { type: integer }
                        paso_bloqueado:
                          type: boolean
                          description: El tramo recto hasta el punto cruza una vía bloqueada (ST_Intersects). Estos van al final

  /zonas:
    get:
      summary: Obtener zonas de riesgo de Esmeraldas
      tags: [Zonas de Riesgo]
      responses:
        '200':
          description: Zonas en formato GeoJSON FeatureCollection
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: FeatureCollection
                  features:
                    type: array
                    items:
                      type: object

  /puntos-servicio:
    post:
      summary: Registrar un albergue o centro de salud (COE)
      tags: [Territorio]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, tipo, capacidad, latitud, longitud]
              properties:
                nombre: { type: string, minLength: 3, maxLength: 160 }
                tipo: { $ref: '#/components/schemas/TipoPuntoServicio' }
                direccion: { type: string, maxLength: 200 }
                telefono: { type: string, maxLength: 30 }
                capacidad: { type: integer, minimum: 1 }
                ocupacion: { type: integer, minimum: 0 }
                latitud: { type: number }
                longitud: { type: number }
      responses:
        '201':
          description: Punto creado con origen coe
        '403':
          description: Requiere rol operador_911 o admin
    get:
      summary: Listar albergues y centros de salud
      tags: [Puntos de Servicio]
      parameters:
        - name: tipo
          in: query
          schema:
            $ref: '#/components/schemas/TipoPuntoServicio'
        - name: solo_activos
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Lista de puntos de servicio
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PuntoServicio'

  /puntos-servicio/{id}/ocupacion:
    patch:
      summary: Actualizar ocupación/cupo de un albergue o centro de salud
      tags: [Puntos de Servicio]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ocupacion]
              properties:
                ocupacion:
                  type: integer
                  minimum: 0
                  example: 45
      responses:
        '200':
          description: Ocupación actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuntoServicio'

  /alertas:
    get:
      summary: Listar alertas activas por sector
      tags: [Alertas]
      responses:
        '200':
          description: Lista de alertas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alerta'

    post:
      summary: Emitir una nueva alerta por sector (Operador 911 / Admin)
      tags: [Alertas]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sector, mensaje, nivel]
              properties:
                sector:
                  type: string
                  example: Sector Isla Piedad
                mensaje:
                  type: string
                  example: Crecida inminente del río Teaone. Evacuar a zonas altas.
                nivel:
                  $ref: '#/components/schemas/Gravedad'
                origen:
                  type: string
                  enum: [oficial, simulada]
                  default: oficial
      responses:
        '201':
          description: Alerta emitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alerta'

  /alertas/{id}/cerrar:
    patch:
      summary: Cerrar una alerta (deja de estar vigente). Solo COE
      tags: [Alertas]
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Alerta cerrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alerta'

  /vias/{id}/estado:
    patch:
      summary: Cambiar el estado de una vía (habilitada, parcial, bloqueada). Solo COE
      tags: [Zonas de Riesgo]
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [habilitada, parcial, bloqueada] }
      responses:
        '200':
          description: Propiedades de la vía actualizada

  /asistencia/pendientes:
    get:
      summary: Necesidades de reportes sin entrega registrada, ordenadas por prioridad. Solo COE
      tags: [Asistencia]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Necesidades pendientes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    reporte_id: { type: string, format: uuid }
                    necesidad: { $ref: '#/components/schemas/Necesidad' }
                    sector: { type: string, nullable: true }
                    personas: { type: integer }
                    gravedad: { $ref: '#/components/schemas/Gravedad' }
                    prioridad: { type: integer }

  /asistencia/entregas:
    get:
      summary: Entregas registradas. Solo COE
      tags: [Asistencia]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de entregas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entrega'
    post:
      summary: Registrar entrega de agua, alimentos, medicinas o rescate para un reporte. Solo COE
      description: La necesidad debe estar pedida en el reporte. Descuenta stock en la misma transacción (409 si no alcanza). Las entregas no se editan ni se borran (auditoría).
      tags: [Asistencia]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reporte_id, necesidad, cantidad]
              properties:
                reporte_id: { type: string, format: uuid }
                necesidad: { $ref: '#/components/schemas/Necesidad' }
                cantidad: { type: integer, minimum: 1 }
                nota: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Entrega registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entrega'

  /asistencia/inventario:
    get:
      summary: Stock de agua, alimentos y medicinas. Solo COE
      tags: [Asistencia]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Inventario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemInventario'

  /asistencia/inventario/{necesidad}:
    patch:
      summary: Ingreso o ajuste de stock. Solo COE
      tags: [Asistencia]
      security:
        - BearerAuth: []
      parameters:
        - { name: necesidad, in: path, required: true, schema: { type: string, enum: [agua, alimentos, medicinas] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delta]
              properties:
                delta: { type: integer, description: Positivo suma, negativo resta. Nunca queda bajo cero }
      responses:
        '200':
          description: Stock actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemInventario'

  /estadisticas:
    get:
      summary: Obtener contadores del centro de operaciones (Panel 911)
      description: Responde a las preguntas clave del dashboard (sección 7.2 de las bases).
      tags: [Estadísticas]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Estadísticas consolidadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadisticasDashboard'

  /estadisticas/recurrencia:
    get:
      summary: Eventos repetidos por sector para priorización
      tags: [Estadísticas]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Recurrencia por sector
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sector:
                      type: string
                    cantidad:
                      type: integer
                    gravedad_promedio:
                      type: string
                    abiertos:
                      type: integer
                    personas_afectadas:
                      type: integer
                    puntaje:
                      type: integer
                      description: Prioridad por reglas (gravedad, personas, vulnerables, rescate y recurrencia). Ordenado de mayor a menor

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Rol:
      type: string
      enum: [ciudadano, operador_911, bomberos, policia, admin]

    TipoIncidente:
      type: string
      enum:
        - inundacion
        - deslizamiento
        - via_bloqueada
        - personas_atrapadas
        - dano_vivienda
        - otro

    EstadoReporte:
      type: string
      enum: [pendiente, en_proceso, atendido, descartado]

    Gravedad:
      type: string
      enum: [baja, media, alta, critica]

    TipoPuntoServicio:
      type: string
      enum: [albergue, centro_salud]

    Necesidad:
      type: string
      enum: [agua, alimentos, medicinas, rescate]

    Usuario:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        correo:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/Rol'
        creado_en:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT Bearer token
        usuario:
          $ref: '#/components/schemas/Usuario'

    ReporteCrearInput:
      type: object
      required:
        - id
        - tipo
        - descripcion
        - gravedad
        - latitud
        - longitud
        - capturado_en
      properties:
        id:
          type: string
          format: uuid
          description: UUID v4 creado en el celular
        tipo:
          $ref: '#/components/schemas/TipoIncidente'
        descripcion:
          type: string
          example: Nivel de agua subiendo rápidamente, vía principal cortada.
        gravedad:
          $ref: '#/components/schemas/Gravedad'
        latitud:
          type: number
          format: double
          example: 0.9681789
        longitud:
          type: number
          format: double
          example: -79.6517202
        precision_m:
          type: number
          description: Precisión del GPS en metros
          example: 8.5
        ubicacion_aproximada:
          type: boolean
          default: false
        capturado_en:
          type: string
          format: date-time
          description: Marca de tiempo UTC del momento de captura en el celular
        personas_afectadas:
          type: integer
          minimum: 0
          default: 0
        ninos:
          type: integer
          minimum: 0
          default: 0
        adultos_mayores:
          type: integer
          minimum: 0
          default: 0
        necesidades:
          type: array
          items:
            $ref: '#/components/schemas/Necesidad'

    Origen:
      type: string
      enum: [ciudadano, simulado, oficial]

    Error:
      type: object
      properties:
        codigo:
          type: string
          example: VALIDACION
        mensaje:
          type: string
        errores:
          type: array
          items:
            type: string

    Reporte:
      type: object
      properties:
        id:
          type: string
          format: uuid
        usuario_id:
          type: string
          format: uuid
          nullable: true
        origen:
          $ref: '#/components/schemas/Origen'
        sector:
          type: string
          nullable: true
          description: Zona de riesgo que contiene el punto (ST_Contains), asignada por el servidor
        tipo:
          $ref: '#/components/schemas/TipoIncidente'
        descripcion:
          type: string
        gravedad:
          $ref: '#/components/schemas/Gravedad'
        estado:
          $ref: '#/components/schemas/EstadoReporte'
        latitud:
          type: number
        longitud:
          type: number
        precision_m:
          type: number
        ubicacion_aproximada:
          type: boolean
        capturado_en:
          type: string
          format: date-time
        recibido_en:
          type: string
          format: date-time
        verificado:
          type: boolean
        personas_afectadas:
          type: integer
        ninos:
          type: integer
        adultos_mayores:
          type: integer
        necesidades:
          type: array
          items:
            $ref: '#/components/schemas/Necesidad'
        foto_url:
          type: string
          nullable: true
        foto_miniatura_url:
          type: string
          nullable: true
        ia_tipo_sugerido:
          type: string
          nullable: true
        ia_gravedad_sugerida:
          type: string
          nullable: true
        ia_explicacion:
          type: string
          nullable: true
        ia_confianza:
          type: number
          nullable: true

    Foto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reporte_id:
          type: string
          format: uuid
        ruta:
          type: string
        ruta_miniatura:
          type: string
        tamano_bytes:
          type: integer
        subida_en:
          type: string
          format: date-time

    Entrega:
      type: object
      properties:
        id: { type: string, format: uuid }
        reporte_id: { type: string, format: uuid }
        necesidad: { $ref: '#/components/schemas/Necesidad' }
        cantidad: { type: integer }
        nota: { type: string, nullable: true }
        entregado_por: { type: string, format: uuid, nullable: true }
        entregado_en: { type: string, format: date-time }

    ItemInventario:
      type: object
      properties:
        necesidad: { type: string, enum: [agua, alimentos, medicinas] }
        cantidad: { type: integer }
        unidad: { type: string }
        actualizado_en: { type: string, format: date-time }

    SugerenciaIA:
      type: object
      properties:
        reporte_id:
          type: string
          format: uuid
        tipo_sugerido:
          $ref: '#/components/schemas/TipoIncidente'
        gravedad_sugerida:
          $ref: '#/components/schemas/Gravedad'
        explicacion:
          type: string
          example: Se detecta acumulación significativa de agua sobre calzada y vehículos semihundidos.
        confianza:
          type: number
          minimum: 0
          maximum: 1
          example: 0.88
        aviso:
          type: string
          example: Sugerencia de apoyo, no oficial. Requiere confirmación humana.

    PuntoServicio:
      type: object
      properties:
        origen:
          type: string
          enum: [simulado, coe]
          description: simulado es dato del escenario; coe lo registró el personal del COE.
        id:
          type: string
          format: uuid
        nombre:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoPuntoServicio'
        latitud:
          type: number
        longitud:
          type: number
        telefono:
          type: string
        capacidad:
          type: integer
        ocupacion:
          type: integer
        direccion:
          type: string
        cupos_libres:
          type: integer
        porcentaje_ocupacion:
          type: number
          example: 75.0
        estado_cupo:
          type: string
          enum: [verde, ambar, rojo]
          description: Semáforo de capacidad (verde < 70%, ámbar 70-90%, rojo > 90%)
        activo:
          type: boolean

    Alerta:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sector:
          type: string
        mensaje:
          type: string
        nivel:
          $ref: '#/components/schemas/Gravedad'
        creado_por:
          type: string
        creado_en:
          type: string
          format: date-time
        origen:
          type: string
          enum: [oficial, simulada]

    ReporteDetalle:
      allOf:
        - $ref: '#/components/schemas/Reporte'
        - type: object
          properties:
            historial:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  estado_anterior:
                    $ref: '#/components/schemas/EstadoReporte'
                  estado_nuevo:
                    $ref: '#/components/schemas/EstadoReporte'
                  operador_nombre:
                    type: string
                  fecha:
                    type: string
                    format: date-time
                  nota:
                    type: string

    EstadisticasDashboard:
      type: object
      properties:
        total_reportes:
          type: integer
        pendientes:
          type: integer
        en_proceso:
          type: integer
        atendidos:
          type: integer
        criticos:
          type: integer
        personas_afectadas_total:
          type: integer
        ninos_total:
          type: integer
        adultos_mayores_total:
          type: integer
        vias_bloqueadas_total:
          type: integer
        albergues_disponibles:
          type: integer
        necesidades_acumuladas:
          type: object
          properties:
            agua:
              type: integer
            alimentos:
              type: integer
            medicinas:
              type: integer
            rescate:
              type: integer

  responses:
    ErrorValidacion:
      description: Error en validación de datos de entrada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

