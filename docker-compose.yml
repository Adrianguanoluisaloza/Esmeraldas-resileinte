# Entorno completo del backend: PostgreSQL + PostGIS y la API Hono.
# 100% aislado: red propia, contenedores con prefijo 'esmeraldas-' y volumenes exclusivos.
# No toca ni interfiere con ningun otro proyecto o contenedor existente en la maquina.

name: esmeraldas-resiliente

services:
  db:
    container_name: esmeraldas-db
    # Tope de recursos: la VM aloja otros proyectos y este no debe afectarlos.
    cpus: "1.5"
    mem_limit: 2g
    # Imagen propia: funciona en x86 y en la VM ARM de Oracle (ver database/Dockerfile).
    build: ./database
    image: esmeraldas-postgis:16-3
    restart: unless-stopped
    networks:
      - esmeraldas-net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resiliente}
      POSTGRES_USER: ${POSTGRES_USER:-resiliente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      # Clave del usuario restringido que usa la API (lo crea 03_rol_aplicacion.sh).
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en .env}
    volumes:
      - datos_db:/var/lib/postgresql/data
      # Solo se ejecutan la primera vez (base vacía). Para recargar: docker compose down -v
      - ./database/01_schema_postgis.sql:/docker-entrypoint-initdb.d/01_schema_postgis.sql:ro
      - ./database/02_seed_escenario_06am.sql:/docker-entrypoint-initdb.d/02_seed_escenario_06am.sql:ro
      - ./database/03_rol_aplicacion.sh:/docker-entrypoint-initdb.d/03_rol_aplicacion.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sin puerto público expuesto: la base solo es visible para nuestra API dentro de esmeraldas-net.

  api:
    container_name: esmeraldas-api
    cpus: "1.5"
    mem_limit: 1g
    build: ./apps/api
    restart: unless-stopped
    networks:
      - esmeraldas-net
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: 3000
      ALMACEN: postgres
      # La API entra con el usuario de permisos mínimos, nunca con el dueño de la base.
      DATABASE_URL: postgres://resiliente_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-resiliente}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:4321,https://esmeraldas-resiliente.pages.dev}
      # Opcional: activa el ingreso con Google (tokens de Firebase).
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      # Enlace de restablecer contraseña y correo saliente. Sin SMTP la API no envía correos.
      URL_WEB: ${URL_WEB:-https://esmeraldas-resiliente.pages.dev}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PUERTO: ${SMTP_PUERTO:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-}
      # Detrás de Cloudflare Tunnel: usar CF-Connecting-IP para el límite de peticiones.
      CONFIAR_EN_PROXY: ${CONFIAR_EN_PROXY:-true}
    # Contenedor endurecido: sin privilegios extra y sistema de archivos de solo lectura (fotos en volumen).
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - fotos:/datos/fotos
    ports:
      # Solo escucha en la propia máquina: el acceso público entra por Cloudflare Tunnel.
      # Para probar desde otro equipo de la red local: API_ESCUCHA=0.0.0.0 en .env.
      - "${API_ESCUCHA:-127.0.0.1}:${API_PUERTO:-3000}:3000"

  # Túnel rápido propio, sin dominio ni puertos abiertos. Solo arranca con: --profile tunel
  # La URL cambia si este contenedor se reinicia: ver con docker logs esmeraldas-tunel.
  tunel:
    container_name: esmeraldas-tunel
    image: cloudflare/cloudflared:latest
    profiles: ["tunel"]
    restart: unless-stopped
    networks:
      - esmeraldas-net
    depends_on:
      - api
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:3000"]

networks:
  esmeraldas-net:
    name: esmeraldas-net
    driver: bridge

volumes:
  datos_db:
    name: esmeraldas_datos_db
  fotos:
    name: esmeraldas_fotos
