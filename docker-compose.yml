# Entorno completo del backend: PostgreSQL + PostGIS y la API Hono.
# 100% aislado: red propia, contenedores con prefijo 'esmeraldas-' y volumenes exclusivos.
# No toca ni interfiere con ningun otro proyecto o contenedor existente en la maquina.

name: esmeraldas-resiliente

services:
  db:
    container_name: esmeraldas-db
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    networks:
      - esmeraldas-net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resiliente}
      POSTGRES_USER: ${POSTGRES_USER:-resiliente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - datos_db:/var/lib/postgresql/data
      # Solo se ejecutan la primera vez (base vacía). Para recargar: docker compose down -v
      - ./database/01_schema_postgis.sql:/docker-entrypoint-initdb.d/01_schema_postgis.sql:ro
      - ./database/02_seed_escenario_06am.sql:/docker-entrypoint-initdb.d/02_seed_escenario_06am.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sin puerto público expuesto: la base solo es visible para nuestra API dentro de esmeraldas-net.

  api:
    container_name: esmeraldas-api
    build: ./apps/api
    restart: unless-stopped
    networks:
      - esmeraldas-net
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: 3000
      ALMACEN: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-resiliente}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-resiliente}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:4321,https://esmeraldas-resiliente.eliasadrianlozadaguanoluisa.workers.dev}
    volumes:
      - fotos:/datos/fotos
    ports:
      - "${API_PUERTO:-3000}:3000"

networks:
  esmeraldas-net:
    name: esmeraldas-net
    driver: bridge

volumes:
  datos_db:
    name: esmeraldas_datos_db
  fotos:
    name: esmeraldas_fotos
