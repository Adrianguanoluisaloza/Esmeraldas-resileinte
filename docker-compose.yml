# Entorno completo del backend: PostgreSQL + PostGIS y la API.
# Local:   cp .env.example .env  (y completa los valores)  ->  docker compose up -d --build
# Oracle:  mismo archivo en la VM; Cloudflare (o Caddy) delante para HTTPS. Ver docs/DESPLIEGUE.md.
# La web (apps/web) NO va aquí: se publica en Cloudflare Pages.

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resiliente}
      POSTGRES_USER: ${POSTGRES_USER:-resiliente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - datos_db:/var/lib/postgresql/data
      # Solo se ejecutan la primera vez (base vacía). Para recargar: docker compose down -v
      - ./database/01_schema_postgis.sql:/docker-entrypoint-initdb.d/01_schema_postgis.sql:ro
      - ./database/02_seed_escenario_06am.sql:/docker-entrypoint-initdb.d/02_seed_escenario_06am.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sin puerto publicado: la base solo es visible para la API dentro de la red de Docker.
    # Para revisarla desde la PC con DBeaver, descomenta la línea siguiente (solo en local).
    # ports: ["127.0.0.1:5432:5432"]

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: 3000
      ALMACEN: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-resiliente}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-resiliente}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:4321}
    volumes:
      - fotos:/datos/fotos
    ports:
      - "${API_PUERTO:-3000}:3000"

volumes:
  datos_db:
  fotos:
